<div class="container-fluid" ng-init="user_view2();">
  <div class="row" style="padding-top: 20px;">
    <div class="col-lg-12 mb-3">
      <div class=" shadow-lg p-4 rounded">
        <h5 class="d-flex justify-content-between align-items-center">
          <span><i class="fa-solid fa-blog"></i> Active User</span>
          
        </h5>

        <div class="alert alert-success" ng-if="deleteMessage"><svg class="bi flex-shrink-0 me-2" width="24" height="24"
            role="img" aria-label="Success:">
            <use xlink:href="#check-circle-fill" />
          </svg>
          {{ deleteMessage }}
        </div>
        <div class="row pt-2">
          <div class="col-md-4 offset-md-8">
            <input class="form-control" type="search" ng-model="search" ng-change="pager.page = 1" placeholder="Search" aria-label="Search">
          </div>
        </div>

        <div class="card-body">
          <div class="table-responsive"><table class="table">
            <thead class="table-light text-center border-dark">
              <tr>
                <th style="width: 5%;">#</th>
                <th style="width: 35%;">Name</th>
                <th style="width: 35%;">User Email</th>
                <th style="width: 10%;">User Type</th>
                <th style="width: 20%;">Active</th>
                <th style="width: 10%;">Deactivate</th>
              </tr>
            </thead>
            <tbody >
              <tr ng-repeat="x in (rows = (user_data2 | filter:search)) | limitTo:pager.size:(pager.page-1)*pager.size">
                <th class="text-center">{{(pager.page-1)*pager.size + $index+1}}</th>
                <td style="text-transform: capitalize;"><b>{{x.name}}</b></td>
                <td>{{x.user_id}}</td>
                <td class="text-center">{{x.type}}</td>
                <td class="text-center" style="background-color: #53EB38;"><b>Online</b></td>
                <td>
                  <button class="btn btn-danger"><i class="fa-solid fa-ban" ng-click="deactivate(x.id);"></i></button>
                </td>
              </tr>
          </table></div>
          <table-pager total="rows.length" pager="pager"></table-pager>
          <div class="row">
            <div class="col-lg-4"></div>
            <div class="col-lg-4 text-center text-danger" ng-if="user_data.length === 0">
              <h3>{{ noDataMessage }} !</h3>
            </div>
            <div class="col-lg-4"></div>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
