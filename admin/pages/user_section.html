<div class="container-fluid" ng-init="user_view();">
  <div class="row" style="padding-top: 20px;">
    <div class="col-lg-12 mb-3">
      <div class=" shadow-lg p-4 rounded">
        <h5 class="d-flex justify-content-between align-items-center">
          <span>User Section</span>
          <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#staticBackdrop"><i
              class="fa-solid fa-plus"></i></button>
        </h5>

        <div class="alert alert-success" ng-if="deleteMessage"><svg class="bi flex-shrink-0 me-2" width="24" height="24"
            role="img" aria-label="Success:">
            <use xlink:href="#check-circle-fill" />
          </svg>
          {{ deleteMessage }}
        </div>
        <div class="row pt-2">
          <div class="col-md-4 offset-md-8">
            <input class="form-control" type="search" ng-model="search" placeholder="Search" aria-label="Search">
          </div>
        </div>

        <div class="card-body">
          <table class="table">
            <thead class="table-light text-center border-dark">
              <tr>
                <th style="width: 5%;">#</th>
                <th style="width: 35%;">Name</th>
                <th style="width: 35%;">User Email</th>
                <th style="width: 10%;">User Type</th>
                <th style="width: 20%;">Action</th>
              </tr>
            </thead>
            <tbody class="text-center">
              <tr ng-repeat="x in user_data | filter:search">
                <th>{{$index+1}}</th>
                <td style="text-transform: capitalize;">{{x.name}}</td>
                <td>{{x.user_id}}</td>
                <td>{{x.type}}</td>
                <td><button class="btn btn-warning" class="btn btn-primary" data-bs-toggle="modal"
                    data-bs-target="#exampleModal" ng-click="user_edit(x.id)"><i
                      class="fa-solid fa-pen-to-square"></i></button>
                  <button class="btn btn-danger"><i class="fa-solid fa-trash"
                      ng-click="user_delete(x.id);"></i></button>
                </td>
              </tr>
          </table>
          <div class="row">
            <div class="col-lg-4"></div>
            <div class="col-lg-4 text-center text-danger" ng-if="user_data.length === 0">
              <h3>{{ noDataMessage }} !</h3>
            </div>
            <div class="col-lg-4"></div>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal sections -->
<!-- insert Modal -->
<div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
  aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="staticBackdropLabel">Create New
          User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-lg-12 mb-3">
            <div class="form-floating">
              <input class="form-control" ng-model="name">
              <label for="floatingTextarea">
                User Name</label>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-12 mb-3">
            <div class="form-floating">
              <input class="form-control" ng-model="user_id">
              <label for="floatingTextarea">
                User Email</label>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-12 mb-3">
            <div class="form-floating">
              <input class="form-control" ng-model="pass">
              <label for="floatingTextarea">
                Password</label>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-12 mb-3">
            <div class="form-floating">
              <select class="form-select" id="floatingSelectGrid" aria-label="Floating label select example"
                ng-model="type">
                <option selected></option>
                <option>Admin</option>
                <option>Student</option>
              </select>
              <label for="floatingTextarea">User Type</label>
            </div>
          </div>
        </div>
        
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal"><i class="fa-solid fa-xmark"></i>
          Close</button>
        <button type="button" class="btn btn-success" ng-click="user_entry();"><i class="fa-solid fa-floppy-disk"></i>
          Create</button>

      </div>
    </div>
  </div>
</div>

<!-- edit Modal -->
<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="staticBackdropLabel">Edit Created User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-lg-12 mb-3">
            <div class="form-floating">
              <input class="form-control" ng-model="name">
              <label for="floatingTextarea">
                User Name</label>
              <input type="hidden" class="form-control" ng-model="idd">
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-12 mb-3">
            <div class="form-floating">
              <input class="form-control" ng-model="user_id">
              <label for="floatingTextarea">
                User Email</label>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-12 mb-3">
            <div class="form-floating">
              <select class="form-select" id="floatingSelectGrid" aria-label="Floating label select example"
                ng-model="type">
                <option selected></option>
                <option>Admin</option>
                <option>Student</option>
              </select>
              <label for="floatingTextarea">User Type</label>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal"><i class="fa-solid fa-xmark"></i>
          Close</button>
        <button type="button" class="btn btn-success" ng-click="user_update()"><i class="fa-solid fa-download"></i>
          Update</button>

      </div>
    </div>
  </div>
</div>
